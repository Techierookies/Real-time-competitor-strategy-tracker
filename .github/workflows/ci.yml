name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check ml backend collector --config ruff.toml

      - name: Generate data and train models
        # Artifacts are not committed, so CI proves the pipeline reproduces
        # from source. If training breaks, the build fails here.
        run: |
          python -m ml.simulate --out data/competitor_prices_synthetic.csv
          python -m ml.train --data data/competitor_prices_synthetic.csv

      - name: Verify the model still beats its naive baselines
        # A regression guard. A model that stops beating "assume no change"
        # should fail the build rather than ship quietly.
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("ml/artifacts/metrics.json"))
          failures = [
              f"h={h}: selected {r['selection']['family']} does not beat baseline"
              for h, r in report["horizons"].items()
              if not r["selection"]["beats_baseline"]
          ]
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("All horizons beat their naive baselines.")
          PY

      - name: Run tests
        # Scraper tests use saved pages and a fake fetcher: no network needed.
        run: pytest --cov=ml --cov=backend/app --cov=collector --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
