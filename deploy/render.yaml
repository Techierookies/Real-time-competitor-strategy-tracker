# One-click deploy on Render: New > Blueprint, point at this repository.
#
# The free tier has no persistent disk, so SQLite is wiped on redeploy. The
# disk block below is on the starter tier. For a free demo, remove the disk
# and let the service reseed from the bundled CSV on boot.

services:
  - type: web
    name: competitor-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true          # Render generates and stores this.
      - key: DATABASE_URL
        value: sqlite:////var/data/tracker.db
      - key: ARTIFACT_DIR
        value: /app/ml/artifacts
      - key: CORS_ORIGINS
        sync: false                  # Set to the deployed frontend origin.
      - key: COLLECT_INTERVAL_MINUTES
        value: "240"
      - key: RETRAIN_INTERVAL_HOURS
        value: "24"
      - key: COLLECTOR_TOKEN
        generateValue: true          # copy into the GitHub secret of the same name
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
    disk:
      name: tracker-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: competitor-tracker-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false                  # Set to the API service URL.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
